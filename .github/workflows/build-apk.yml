name: Build APK AntiMaling

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK (dengan retry)
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd /tmp
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            -o cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          chmod +x "$ANDROID_HOME/cmdline-tools/latest/bin/"* 2>/dev/null || true

          # Terima lisensi. Diulang + dicek hasilnya, karena `yes` kadang mati
          # duluan (SIGPIPE) sehingga sebagian lisensi tak diterima dan
          # sdkmanager --install berikutnya gagal.
          for i in 1 2 3; do
            yes 2>/dev/null | sdkmanager --licenses >/dev/null 2>&1 || true
            if sdkmanager --licenses </dev/null 2>&1 | grep -q "All SDK package licenses accepted"; then
              echo "Lisensi diterima (percobaan $i)"; break
            fi
            echo "Lisensi belum lengkap, ulangi ($i)"; sleep 3
          done

          # Pasang paket, dengan retry penuh (unduhan dari dl.google.com kadang putus)
          for i in 1 2 3; do
            echo "--- sdkmanager --install percobaan $i ---"
            if sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"; then
              echo "SDK siap"; break
            fi
            echo "Gagal install, tunggu lalu ulangi"; sleep 10
          done

          # Pastikan paket benar-benar ada, jangan sampai lolos ke build
          for rel in "platforms/android-34" "build-tools/34.0.0"; do
            if [ ! -d "$ANDROID_HOME/$rel" ]; then
              echo "::error::Paket SDK tidak terpasang: $rel"
              ls -la "$ANDROID_HOME" 2>/dev/null || true
              exit 1
            fi
            echo "OK paket: $rel"
          done
          sdkmanager --list_installed 2>/dev/null | head -20 || true

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiMaling-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
